# Refresh-on-`main` golden-image build (environment-management.md §3 Layer 3 + §7 P2).
#
# Rebuilds + pushes the runner GOLDEN BASE image (neutral sandbox + harness + `mise`
# + the WARM mise BASELINE) whenever `main` changes a path that DEFINES the image —
# `runner/**` (the Dockerfile, entrypoint, and the `mise.baseline.toml` warm-baseline
# spec) or this workflow. The build applies BuildKit `mode=max` registry cache so a
# refresh re-pushes only the changed layers (the unchanged toolchain downloads stay
# warm) and tags the result by CONTENT DIGEST (`golden-<digest>`).
#
# NOTE ON DOCTRINE: this is Tanren's OWN monorepo CI on GitHub Actions — the same
# platform `ci.yml` runs on. It is NOT the no-Actions DELIVERY doctrine, which
# governs the gate of the apps Tanren BUILDS (those run the native `.tanren/ci.yml`
# shell gate). The platform building its own image on Actions is orthogonal.
#
# It runs the SAME `scripts/dev/build-golden-image.sh` recipe as local dev, so the CI
# path and the local path can never drift. PUSH defaults OFF on pull_request (build +
# cache-validate only — no registry write from an untrusted PR); it pushes only on the
# `main` push event, to GHCR.
name: golden-image

on:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - "scripts/dev/build-golden-image.sh"
      - ".github/workflows/golden-image.yml"
  pull_request:
    paths:
      - "runner/**"
      - "scripts/dev/build-golden-image.sh"
      - ".github/workflows/golden-image.yml"
  # Allow a manual refresh (e.g. to re-bake the warm baseline at the latest patches
  # without a code change) — env-management.md §3 "continuous refresh".
  workflow_dispatch:

# Serialize refreshes on `main` so two pushes don't race the digest tag / cache ref.
concurrency:
  group: golden-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing the image + cache to GHCR (the org's container registry) on `main`.
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: tanren-runner
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push only on a `main` push (or a manual dispatch on `main`); a PR build
      # validates the Dockerfile + warms the cache import but writes nothing.
      - name: Decide push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=0" >> "$GITHUB_OUTPUT"
          else
            echo "value=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.value == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SAME script local dev runs (`just build-golden-image`). It creates its own
      # buildx builder; on GHCR (HTTPS) the insecure-registry config it writes is inert.
      - name: Build (+ push on main) the golden image
        env:
          PUSH: ${{ steps.push.outputs.value }}
        run: ./scripts/dev/build-golden-image.sh
