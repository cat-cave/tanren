name: issue claim

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  claim:
    # Only real issues (not PR conversation comments) with a /claim or /unclaim command.
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body, '/claim') ||
       contains(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/ci/issue-claim.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
