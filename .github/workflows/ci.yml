name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Turborepo runs build/typecheck (via `just ci`). Its cache lives in .turbo/;
      # the cache step below persists it across runs so unchanged packages are
      # restored, not rebuilt. Telemetry off in CI.
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.0 --activate
      # jujutsu (jj) — the sole WorkspaceVcsCore backend. The WorkspaceVcsCore
      # conformance drives a REAL jj process, so `just ci` needs jj on PATH. Pinned to
      # the same v0.42.0 the runner Dockerfile installs (the x86_64 musl release
      # binary, matching ubuntu-latest amd64).
      - name: Install jj
        run: |
          set -euo pipefail
          JJ_VERSION=0.42.0
          ASSET="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${ASSET}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 -o "/tmp/${ASSET}" "${URL}"
          tar xzf "/tmp/${ASSET}" -C /tmp jj
          sudo install -m 0755 /tmp/jj /usr/local/bin/jj
          rm -f "/tmp/${ASSET}" /tmp/jj
          jj --version
      # Resolve the pnpm content-addressable store path so we can cache it (pnpm is
      # only on PATH after corepack activates it, hence this ordering).
      - run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: just ci
      - run: just smoke
      - if: always()
        run: just compose-down
