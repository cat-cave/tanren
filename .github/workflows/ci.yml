name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "spec-*"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - run: docker compose build orchestrator dashboard runner
      - run: ssh-keygen -t ed25519 -N "" -f /tmp/tanren_runner_key
      - run: TANREN_RUNNER_AUTHORIZED_KEY="$(cat /tmp/tanren_runner_key.pub)" docker compose up -d postgres vault orchestrator dashboard runner ntfy
      - run: ./scripts/wait-for-url.sh http://localhost:3100/healthz
      - run: ./scripts/wait-for-url.sh http://localhost:3000/healthz
      - run: curl -fsS -X POST http://localhost:3100/hello/run
      - run: ssh -i /tmp/tanren_runner_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/tanren_runner_known_hosts tanren@localhost 'echo tanren-runner-ok'
      - name: Run live SSH substrate integration
        run: |
          fingerprint="$(ssh-keyscan -p 2222 -t ed25519 localhost 2>/dev/null | ssh-keygen -lf - -E sha256 | awk 'NR == 1 { print $2 }')"
          test -n "$fingerprint"
          TANREN_SSH_INTEGRATION=1 \
            TANREN_SSH_KEY_PATH=/tmp/tanren_runner_key \
            TANREN_SSH_HOST=127.0.0.1 \
            TANREN_SSH_PORT=2222 \
            TANREN_SSH_USER=tanren \
            TANREN_SSH_HOST_FINGERPRINT="$fingerprint" \
            TANREN_SSH_HOST_KEY_ALGORITHMS=ssh-ed25519 \
            pnpm exec vitest run services/orchestrator/tests/ssh.integration.test.ts
      - if: always()
        run: docker compose down -v
