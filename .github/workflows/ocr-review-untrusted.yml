name: ocr-review-untrusted

# ============================================================================
# UNTRUSTED lane (DESIGN §SECURITY.1, issue #110).
#
# Runs on `pull_request`, so it may execute code from a fork / from PR head.
# OCR reads `.opencodereview/rule.json` from the checked-out tree and has a
# git-option-injection RCE (`--commit '-O./pwn.sh'`). Therefore this job:
#   * holds the LLM key ONLY (a spend-capped, low-value secret OCR needs to
#     authenticate to OpenRouter) and NO repo-write token — the two secrets are
#     split by blast radius: the write token that could push to `main` lives in
#     the TRUSTED lane, which never runs OCR/PR code; the worst a leaked LLM key
#     buys an attacker is capped LLM spend, not repo write. For same-repo PRs
#     GitHub provides the LLM secret; fork PRs get NO secret by design (a
#     maintainer re-triggers per the fork-review note in ocr-review-trusted.yml),
#   * has a read-only, write-incapable GITHUB_TOKEN and NEVER posts anything,
#   * checks out PR head READ-ONLY and deletes any PR-head `.opencodereview/`,
#   * loads the rule file AND the pipeline SCRIPTS from the TRUSTED BASE tree
#     (extracted from the base SHA via `git archive`, never from PR head), and
#   * produces a single `review-output.json` artifact — nothing else.
#
# CHECKOUT MODEL (unified — the split base/head checkout is gone). There is ONE
# git checkout: the PR head, with the base commit fetched into it so the whole
# pipeline sees BOTH refs (OCR's `--from <base> --to <head>` and the
# preflight/guard/ground `git diff base..head`). A directory holding two
# unrelated checkouts is NOT itself a git repo, so `gh` and git-diff crash with
# "not a git repository" — a unified checkout fixes that, and every `gh` call is
# also made repo-explicit (`--repo`, resolved from $GITHUB_REPOSITORY by the
# scripts). The trusted rule + scripts still come from the base SHA (not PR
# head): `git archive <base_sha> ops/review` extracts them to $RUNNER_TEMP, so a
# PR that edits ops/review/** still cannot change what actually runs.
#
# The companion `ocr-review-trusted.yml` (workflow_run) holds the WRITE token and
# does all posting, bound to the exact head SHA recorded in the artifact; it
# never runs OCR or any PR-head code.
# ============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # FORK-PR REVIEW (authorized-`/review` command) — see the block below.
  issue_comment:
    types: [created]

# FORK-PR REVIEW (`/review` command) — see DESIGN §SECURITY.7. A fork
# `pull_request` run has no LLM key → OCR can't run → review_complete=false →
# `review/verdict` FAILS CLOSED. To review a fork, a `/review` comment runs OCR
# WITH the key (same blast radius as the same-repo lane: LLM key only, no write
# token), gated by the job-level `if:` to a trusted human or trevor-workstation[bot].

# issue #58 — for `pull_request`, one in-flight review per PR (a new push cancels
# the stale run). For `issue_comment` (/review), a UNIQUE per-run group: the
# concurrency group is evaluated BEFORE the job-level authorization `if:`, so a
# shared PR group would let ANY unauthorized comment (fork author included) join
# the group and cancel an in-flight authorized /review via cancel-in-progress —
# a review DoS. Per-run isolation means a comment event can never cancel another
# run (each authorized /review is a deliberate, standalone action).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ocr-review-pr-{0}', github.event.pull_request.number)
        || format('ocr-review-run-{0}', github.run_id) }}
  cancel-in-progress: true

# Least privilege. `contents: read` (checkouts) + `pull-requests: read`
# (assemble-context / reconcile read prior findings, discussion, sticky marker).
# NO write scope anywhere: this job cannot post, comment, or set a status.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest # ephemeral runner (DESIGN §SECURITY.5)
    # AUTHORIZATION GATE (fail-safe: the job never starts — never checks out fork
    # code — unless authorized). `pull_request` runs unconditionally (same-repo
    # auto path). An `issue_comment` runs ONLY for a `/review` command on a PR
    # from a trusted human (OWNER/MEMBER/COLLABORATOR) OR the trevor-workstation[bot]
    # agent identity (so agents can audit fork PRs). A fork author (CONTRIBUTOR/
    # NONE) or any other bot is rejected here. The command must be EXACTLY
    # `/review` or `/review <args>` — `/review-anything` is rejected (a command
    # boundary, not a prefix) so an arbitrary slash-command can't start a keyed run.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == 'trevor-workstation[bot]'))
    env:
      # PR number from whichever event fired (pull_request or the /review comment).
      # All downstream steps read this; the head/base SHAs are resolved + sanitized
      # by the `ctx` + `sha` steps (DESIGN §SECURITY.3), never taken from raw input.
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # OCR install target. `npm i -g --prefix` fails on a standard runner global
      # path, so we invoke via `npx --package <pkg> ocr` (binary name != package).
      OCR_PACKAGE: "@alibaba-group/open-code-review"
      # Cost/behavior knobs consumed by preflight.mjs (issue #409). Defaults live
      # in the script; surfaced here so an operator can override per-repo.
      MAX_FILES: "60"
      MAX_DIFF_LINES: "8000"
      REVIEW_DEADLINE_SEC: "1800"
    steps:
      # --- Resolve PR context (works for BOTH triggers) -----------------------
      # pull_request: SHAs from the trusted event context. issue_comment (/review):
      # from the PR API — NEVER the comment text. Fork head is fetched via the
      # advertised refs/pull/<n>/head (n digits-validated). Sanitized next step.
      - name: Resolve PR context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }} # read-only: read the PR head/base SHA
          REPO: ${{ github.repository }}
          EV_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EV_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$' || { echo "::error::bad pr number: $PR_NUMBER"; exit 1; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_TIP="$EV_BASE_SHA"
            RAW_HEAD="$EV_HEAD_SHA"
            CHECKOUT_REF="$EV_HEAD_SHA"
          else
            # /review on a (possibly fork) PR: authoritative SHAs from the API.
            BASE_TIP="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.sha')"
            RAW_HEAD="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
            # The fork head commit is advertised on the base repo as this ref.
            CHECKOUT_REF="refs/pull/$PR_NUMBER/head"
          fi
          # Two bases (do NOT conflate): raw_base = base-branch TIP, used ONLY to
          # extract the TRUSTED rules+scripts (`git archive`) so we run the LATEST
          # reviewer from main. raw_diff_base = MERGE-BASE, used for every DIFF
          # (guard/preflight/OCR/ground) so a behind branch is reviewed for only
          # its OWN changes — a base-tip two-dot diff would show main's newer
          # ops/review + ocr-* commits (that the PR lacks) as reversions → FALSE
          # rule_change + distorted review. Compare API gives the merge-base w/o
          # local history; fail-safe to the base tip (fail-closed, never -open).
          RAW_DIFF_BASE="$BASE_TIP"
          MERGE_BASE="$(gh api "repos/$REPO/compare/${BASE_TIP}...${RAW_HEAD}" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
          if printf '%s' "$MERGE_BASE" | grep -Eq '^[0-9a-f]{40}$'; then
            RAW_DIFF_BASE="$MERGE_BASE"
            echo "diff base = merge-base ${MERGE_BASE}; trusted base = tip ${BASE_TIP}"
          else
            echo "::warning::could not resolve merge-base for ${BASE_TIP}...${RAW_HEAD}; diffing from base tip"
          fi
          echo "raw_base=$BASE_TIP" >> "$GITHUB_OUTPUT"
          echo "raw_diff_base=$RAW_DIFF_BASE" >> "$GITHUB_OUTPUT"
          echo "raw_head=$RAW_HEAD" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

      # --- Unified checkout: PR head, with base fetched below ------------------
      # ONE checkout (issue #287 — OCR runs from a real git root). UNTRUSTED
      # PR-head tree, but nothing security-sensitive is READ from it (rules +
      # scripts are extracted from the base SHA below). fetch-depth:0 so base +
      # head are reachable; persist-credentials:false keeps it write-incapable.
      - name: Checkout PR head (read-only, untrusted)
        uses: actions/checkout@v6 # actions/checkout (first-party)
        with:
          ref: ${{ steps.ctx.outputs.checkout_ref }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6 # actions/setup-node (first-party)
        with:
          node-version: "24"
          package-manager-cache: false

      # --- Sanitize SHAs (DESIGN §SECURITY.3) ---------------------------------
      # Validate ^[0-9a-f]{7,40}$ and reject a leading '-' BEFORE any sha reaches
      # git or OCR. Export the clean values for later steps.
      - name: Sanitize base/head SHAs
        id: sha
        env:
          # Raw SHAs resolved by `ctx` (event context for pull_request, PR API for
          # /review). Re-validated here before ANY use, per DESIGN §SECURITY.3.
          RAW_BASE_SHA: ${{ steps.ctx.outputs.raw_base }}
          RAW_DIFF_BASE_SHA: ${{ steps.ctx.outputs.raw_diff_base }}
          RAW_HEAD_SHA: ${{ steps.ctx.outputs.raw_head }}
        run: |
          set -euo pipefail
          sanitize() {
            local label="$1" val="$2"
            case "$val" in
              -*) echo "::error::${label} refuses leading '-' (option injection): ${val}"; exit 1;;
            esac
            if ! printf '%s' "$val" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::${label} is not a valid sha (^[0-9a-f]{7,40}\$): ${val}"; exit 1
            fi
            printf '%s' "$val"
          }
          BASE_SHA="$(sanitize base "$RAW_BASE_SHA")"
          DIFF_BASE_SHA="$(sanitize diff_base "$RAW_DIFF_BASE_SHA")"
          HEAD_SHA="$(sanitize head "$RAW_HEAD_SHA")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "diff_base_sha=$DIFF_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # base_sha (tip) for the trusted `git archive`; diff_base_sha (merge-base) +
      # head for the diffs. Sanitized shas only; fetch each if not already present.
      - name: Fetch base commits
        working-directory: repo
        run: |
          set -euo pipefail
          for sha in "${{ steps.sha.outputs.base_sha }}" "${{ steps.sha.outputs.diff_base_sha }}"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 origin "$sha" || \
              git fetch --no-tags origin "$sha"
            git cat-file -e "${sha}^{commit}"
          done
          git cat-file -e "${{ steps.sha.outputs.head_sha }}^{commit}"

      # --- Extract the TRUSTED base review tree (rules + scripts) -------------
      # `git archive <base_sha> ops/review` materializes the reviewer config +
      # scripts AS AT THE BASE TIP — never PR head — so a PR editing ops/review/**
      # cannot change what runs (DESIGN §SECURITY.1/.2/.4). Extracted to an
      # absolute $RUNNER_TEMP path; every script is invoked from there.
      - name: Extract trusted base review tree
        id: base
        working-directory: repo
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.sha.outputs.base_sha }}"
          # Defense in depth: re-assert the sha shape before it reaches git.
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::bad base_sha: $BASE_SHA"; exit 1; }
          BASE_TREE="$RUNNER_TEMP/base-review"
          rm -rf "$BASE_TREE"; mkdir -p "$BASE_TREE"
          # `--` after the sha is belt-and-suspenders; the sha is already pure hex.
          git archive --format=tar "$BASE_SHA" -- ops/review | tar -x -C "$BASE_TREE"
          SCRIPTS="$BASE_TREE/ops/review/scripts"
          RULE_ABS="$BASE_TREE/ops/review/tanren-ocr-rules.json"
          ROUTING_ABS="$BASE_TREE/ops/review/model-routing.json"
          test -d "$SCRIPTS" || { echo "::error::missing base scripts dir: $SCRIPTS"; exit 1; }
          test -f "$RULE_ABS" || { echo "::error::missing base rule file: $RULE_ABS"; exit 1; }
          test -f "$ROUTING_ABS" || { echo "::error::missing base routing file: $ROUTING_ABS"; exit 1; }
          echo "scripts=$SCRIPTS" >> "$GITHUB_OUTPUT"
          echo "rule_abs=$RULE_ABS" >> "$GITHUB_OUTPUT"
          echo "routing_abs=$ROUTING_ABS" >> "$GITHUB_OUTPUT"

      # --- Neutralize the PR-head reviewer-config dir (DESIGN §SECURITY.2) -----
      # Any `.opencodereview/` shipped by the PR is deleted so OCR cannot load a
      # PR-authored rule.json. Rules come only from the trusted base tree above.
      - name: Delete PR-head .opencodereview/
        working-directory: repo
        run: |
          set -euo pipefail
          rm -rf .opencodereview
          test ! -e .opencodereview

      # --- Reviewer-config change guard (DESIGN §SECURITY.4) ------------------
      # Runs the TRUSTED base copy of guard-rule-changes.mjs against base..head
      # from the unified repo root. rule_change=true forces the trusted job to
      # post a P0 + verdict=FAIL.
      - name: Guard reviewer-config changes
        id: guard
        working-directory: repo
        env:
          BASE_SHA: ${{ steps.sha.outputs.diff_base_sha }} # merge-base: only the PR's own changes
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/guard-rule-changes.mjs" \
            --base "$BASE_SHA" --head "$HEAD_SHA" | tee "$RUNNER_TEMP/guard.json"

      # --- Preflight: size/cost gate + ignore-glob (issue #409) ---------------
      - name: Preflight (cost/size gate)
        working-directory: repo
        env:
          BASE_SHA: ${{ steps.sha.outputs.diff_base_sha }} # merge-base: only the PR's own changes
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/preflight.mjs" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/preflight.json"

      # --- Assemble background context (issue #59/#324) -----------------------
      # Reads prior OCR findings + human/bot comments + linked-issue acceptance.
      # Uses the read-only token; makes ONLY `gh` calls (repo-explicit via
      # $GITHUB_REPOSITORY — no git inference), writes context.md at an ABSOLUTE
      # path for OCR's --background-file (issue #324). Runs from the repo root
      # for uniformity, though it needs no git.
      - name: Assemble review context
        id: context
        working-directory: repo
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          GITHUB_TOKEN: ${{ github.token }} # read-only; assemble-context only reads
        run: |
          set -euo pipefail
          # --out is a DIRECTORY; the script names the file (PR+sha) and prints
          # its ABSOLUTE path on stdout (issue #324). Capture that path — do NOT
          # assume a fixed filename.
          CONTEXT_MD="$(node "${{ steps.base.outputs.scripts }}/assemble-context.mjs" \
            --pr "$PR_NUMBER" --out "$RUNNER_TEMP/context")"
          test -f "$CONTEXT_MD"
          echo "context_md=$CONTEXT_MD" >> "$GITHUB_OUTPUT"

      # --- Select model(s) (config: model-routing.json) -----------------------
      - name: Select model
        working-directory: repo
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/select-model.mjs" \
            --preflight "$RUNNER_TEMP/preflight.json" \
            --routing "${{ steps.base.outputs.routing_abs }}" \
            > "$RUNNER_TEMP/model.json"

      # --- Install OCR --------------------------------------------------------
      # `npm i -g --prefix` breaks on the standard runner global path; use npx
      # with an explicit --package (the `ocr` binary name differs from the pkg).
      - name: Warm OCR (npx)
        run: npx --yes --package "$OCR_PACKAGE" ocr --version || true

      # --- Run OCR from the git ROOT of the unified checkout ------------------
      # Rule + background-file are ABSOLUTE paths pointing at TRUSTED, base-derived
      # artifacts. --from/--to are the sanitized SHAs. No PR-controlled string is
      # interpolated into an OCR flag. A timed-out run is still billable, so we
      # always keep whatever partial JSON was written (issue #409).
      - name: Run OCR review
        id: ocr
        working-directory: repo
        env:
          BASE_SHA: ${{ steps.sha.outputs.diff_base_sha }} # merge-base: OCR reviews only the PR's own changes
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          RULE_ABS: ${{ steps.base.outputs.rule_abs }}
          MODEL_JSON: ${{ runner.temp }}/model.json
          # --- OCR LLM auth (the ONLY secret this lane carries) ----------------
          # OCR reads the bearer token from **OCR_LLM_TOKEN** (verified against the
          # v1.7.15 binary: it checks OCR_LLM_URL/OCR_LLM_TOKEN/OCR_LLM_MODEL — there
          # is NO OCR_LLM_AUTH_TOKEN). A wrong name here => "no valid LLM endpoint
          # configured" => OCR never runs. On a same-repo PR GitHub injects
          # `secrets.OPENROUTER_API_KEY`; on a FORK PR the secret is empty (fork
          # jobs get no secrets), so OCR cannot run and the completeness step below
          # records review_complete=false — the gate then FAILS CLOSED (never a
          # green on an unreviewed fork PR). A fork PR is reviewed via the
          # authorized /review path. The URL / protocol / model are non-secret.
          OCR_LLM_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_LLM_URL: https://openrouter.ai/api/v1
          OCR_LLM_PROTOCOL: openai
        run: |
          set -euo pipefail
          # Model id resolved by select-model.mjs; default to the routing default.
          MODEL="$(node -e 'const m=require(process.env.MODEL_JSON);process.stdout.write((m.models&&m.models[0])||"openai/gpt-5.6-luna")')"
          echo "using model: $MODEL"
          # Non-secret; surface the resolved model to OCR as well as the --model flag.
          export OCR_LLM_MODEL="$MODEL"
          OCR_RAW="$RUNNER_TEMP/ocr-raw.json"
          # -- FAIL-CLOSED completeness (do NOT regress) — see validate-ocr-result.mjs.
          # CERTIFY only if OCR exits 0 AND emits a well-formed result (object with
          # an array `comments`); merely-valid JSON would leave the gate fail-open.
          set +e
          npx --yes --package "$OCR_PACKAGE" ocr review \
            --model "$MODEL" \
            --rule "$RULE_ABS" \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --background-file "${{ steps.context.outputs.context_md }}" \
            --format json \
            > "$OCR_RAW"
          OCR_EXIT=$?
          set -e
          REVIEW_COMPLETE=false
          if [ "$OCR_EXIT" -eq 0 ] && [ -s "$OCR_RAW" ] \
             && node "${{ steps.base.outputs.scripts }}/validate-ocr-result.mjs" "$OCR_RAW"; then
            REVIEW_COMPLETE=true
          else
            echo "::warning::OCR did not complete a valid review (exit=$OCR_EXIT); review/verdict will FAIL CLOSED"
            # Keep any partial bytes for debugging, but normalize to valid JSON so
            # the downstream JSON pipeline still runs (findings will be empty and
            # review_complete=false forces the gate to fail).
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "$OCR_RAW" >/dev/null 2>&1 || echo "{}" > "$OCR_RAW"
          fi
          echo "review_complete=$REVIEW_COMPLETE" >> "$GITHUB_OUTPUT"
          echo "ocr_exit=$OCR_EXIT" >> "$GITHUB_OUTPUT"

      # --- JSON pipeline: ground -> dedup -> reconcile ------------------------
      # ground-findings needs the unified repo (git diff base..head); dedup +
      # reconcile are pure/gh-read (repo-explicit). reconcile emits the new marker.
      - name: Ground findings
        working-directory: repo
        env:
          BASE_SHA: ${{ steps.sha.outputs.diff_base_sha }} # merge-base: ground against the PR's own changes
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/ground-findings.mjs" \
            --ocr "$RUNNER_TEMP/ocr-raw.json" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/grounded.json"

      # --- Human signal: resolved threads + 👎 reactions ⇒ dismissed -----------
      # A maintainer RESOLVING a finding's review thread OR reacting 👎 on its
      # comment means "false positive — never resurface". Runs BEFORE dedup, on the
      # read-only token (LISTs comments/reactions/reviewThreads; the GraphQL query
      # works with `pull-requests: read`). Its `dismissed` output threads into BOTH
      # dedup (drop this round) and reconcile (UNION into the persisted marker).
      - name: Gather human signal
        id: signal
        working-directory: repo
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          GITHUB_TOKEN: ${{ github.token }} # read-only: comments + reactions + reviewThreads
          # The reviewer's login (public var, not a secret — safe in the untrusted
          # lane) so gather-signal scopes ocr-finding comments + their reactions/
          # resolution to the reviewer's OWN identity. Defaults to github-actions[bot]
          # when the reviewer App is not configured (matches the trusted post lane).
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN || 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/gather-signal.mjs" \
            --pr "$PR_NUMBER" \
            > "$RUNNER_TEMP/signal.json"

      - name: Dedup findings
        working-directory: repo
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/dedup.mjs" \
            --in "$RUNNER_TEMP/grounded.json" \
            --pr "$PR_NUMBER" \
            --dismissed "${{ steps.signal.outputs.dismissed }}" \
            > "$RUNNER_TEMP/deduped.json"
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only: prior open/dismissed fps

      - name: Reconcile state
        working-directory: repo
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }} # read-only: prior sticky marker
        run: |
          set -euo pipefail
          node "${{ steps.base.outputs.scripts }}/reconcile.mjs" \
            --in "$RUNNER_TEMP/deduped.json" \
            --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --dismissed "${{ steps.signal.outputs.dismissed }}" \
            > "$RUNNER_TEMP/reconciled.json"

      # --- Assemble the single artifact payload -------------------------------
      # review-output.json is the ONLY thing the trusted job trusts. It binds the
      # exact head/base SHA, the rule_change flag, preflight metadata, the
      # reconciled findings, and the new sticky-marker string.
      - name: Assemble review-output.json
        env:
          BASE_SHA: ${{ steps.sha.outputs.base_sha }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          RULE_CHANGE: ${{ steps.guard.outputs.rule_change }}
          RULE_CHANGE_PATHS: ${{ steps.guard.outputs.rule_change_paths }}
          # Completeness signal from the OCR step. Absent/"false" ⇒ the review did
          # not certify ⇒ verdict.mjs fails the gate closed (no green on a crash).
          REVIEW_COMPLETE: ${{ steps.ocr.outputs.review_complete }}
          OCR_EXIT: ${{ steps.ocr.outputs.ocr_exit }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const T = process.env.RUNNER_TEMP;
          const readJson = (p, d) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return d; } };
          const reconciled = readJson(`${T}/reconciled.json`, { findings: [], marker: "" });
          const preflight = readJson(`${T}/preflight.json`, {});
          const model = readJson(`${T}/model.json`, {});
          // FAIL CLOSED: certify ONLY on an explicit review_complete=true. A
          // missing/false value (crash, missing key, partial stream) is NOT a
          // clean review — the gate must fail, not pass on zero findings.
          const reviewComplete = process.env.REVIEW_COMPLETE === "true";
          const out = {
            schema: "ocr-review-output/v1",
            pr_number: Number(process.env.PR_NUMBER),
            base_sha: process.env.BASE_SHA,
            head_sha: process.env.HEAD_SHA,       // trusted job binds to THIS sha
            rule_change: process.env.RULE_CHANGE === "true",
            rule_change_paths: (process.env.RULE_CHANGE_PATHS || "").split(",").filter(Boolean),
            review_complete: reviewComplete,
            ocr_exit: Number(process.env.OCR_EXIT ?? "-1"),
            oversized: !!preflight.oversized,
            preflight,
            model,
            findings: reconciled.findings || [],
            addressed: reconciled.addressed || [],
            marker: reconciled.marker || "",
          };
          fs.writeFileSync(`${T}/review-output.json`, JSON.stringify(out, null, 2));
          console.log(`review-output.json: pr=${out.pr_number} head=${out.head_sha} rule_change=${out.rule_change} review_complete=${out.review_complete} findings=${out.findings.length}`);
          NODE

      # --- Upload the artifact (JSON + assembled context) ---------------------
      # This is the entire output of the untrusted lane. No review is posted here.
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v7 # actions/upload-artifact (first-party)
        with:
          name: ocr-review-output
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/review-output.json
            ${{ steps.context.outputs.context_md }}
