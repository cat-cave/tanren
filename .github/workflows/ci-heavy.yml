# Tier 2 (heavy, on the merge queue): the full gate. Runs on the BATCHED, rebased
# `merge_group` commit (amortized across the batch), plus `push: main` as a post-merge
# safety net. Runs `just ci` (fast-check + build) + `just smoke` (the full RLS + integration
# smoke suite). A failing merge group is bisected + the culprit ejected by GitHub's native
# merge queue.
#
# CUTOVER: this is the legacy `ci.yml` `check` behavior, moved off `pull_request` onto the
# queue. Required status context on `merge_group`: `ci-heavy`. See ops/review/CUTOVER.md —
# the queue MUST be enabled and this context required before the legacy `check` is removed,
# or PRs lose their build+smoke gate.
name: ci-heavy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  ci-heavy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      TANREN_SECRETS_MODE: dev-defaults
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.0 --activate
      - name: Install jj
        run: |
          set -euo pipefail
          JJ_VERSION=0.42.0
          ASSET="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${ASSET}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 -o "/tmp/${ASSET}" "${URL}"
          mkdir -p /tmp/jjx
          tar xzf "/tmp/${ASSET}" -C /tmp/jjx
          sudo install -m 0755 /tmp/jjx/jj /usr/local/bin/jj
          rm -rf "/tmp/${ASSET}" /tmp/jjx
          jj --version
      - run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: just ci
      - run: just smoke
      - if: always()
        run: just compose-down

  # review/verdict PASS-THROUGH for the merge queue (only on merge_group).
  #
  # The LLM review gate (`review/verdict`) is enforced at QUEUE ENTRY: a PR
  # cannot be added to the queue unless `review/verdict` is `success` on its
  # head (it is a required check that runs on `pull_request` via the OCR lane).
  # But `review/verdict` NEVER reports on the `merge_group` event, and GitHub's
  # merge queue waits for every required check to report on the merge group —
  # so without this stamp the queue would deadlock. The rebased merge-group
  # code IS re-verified for correctness by the `ci-heavy` job above; only the
  # (advisory, already-enforced) LLM review is carried forward, not re-run per
  # rebase. See ops/review/CUTOVER.md §queue.
  review-verdict-passthrough:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Stamp review/verdict=success on the merge-group head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$MG_HEAD" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::bad merge_group head sha: $MG_HEAD"; exit 1; }
          gh api -X POST "repos/${REPO}/statuses/${MG_HEAD}" \
            -f state=success \
            -f context=review/verdict \
            -f description="carried from PR entry gate (review enforced pre-queue)"
