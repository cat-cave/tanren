commit-msg:
  jobs:
    - name: mergify change-id
      run: $(git rev-parse --git-common-dir)/hooks/mergify-hooks/commit-msg.sh "{1}"

post-commit:
  jobs:
    - name: mergify change-id safety net
      run: $(git rev-parse --git-common-dir)/hooks/mergify-hooks/post-commit.sh

prepare-commit-msg:
  jobs:
    - name: mergify preserve change-id
      run: $(git rev-parse --git-common-dir)/hooks/mergify-hooks/prepare-commit-msg.sh "{1}" "{2}" "{3}"

pre-push:
  jobs:
    - name: mergify stack guard
      run: $(git rev-parse --git-common-dir)/hooks/mergify-hooks/pre-push.sh
    - name: fast check
      run: corepack pnpm run check:fast
