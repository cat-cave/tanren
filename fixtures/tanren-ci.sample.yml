# Sample .tanren/ci.yml — the native gate definition (CiConfigV1).
#
# Drop this file at `.tanren/ci.yml` in a target repo to control which shell steps
# Tanren runs at each point in a run's lifecycle. Tanren runs these steps ITSELF,
# over SSH, on the runner — there is NO GitHub Actions. The `pre_merge` tier is the
# merge authority: a passing pre_merge gate admits the merge.
#
# See docs/operator-guide/ci-config.md for the full schema reference.

version: 1

# Optional. Run once before the gate to provision dependencies (Tanren runs it
# over SSH on the runner workspace).
bootstrap:
  run: "pnpm install --frozen-lockfile"

# Tiers are named lists of shell steps. `fast` and `slow` are required; you
# may add extra named tiers (e.g. `integration`) and map them under `when`.
tiers:
  fast:
    - name: lint
      run: "pnpm lint"
    - name: typecheck
      run: "pnpm typecheck"
    - name: unit
      run: "pnpm test"
  slow:
    - name: build
      run: "pnpm build"
    - name: integration-test
      run: "pnpm test:integration"

# Declarative tier -> lifecycle-point mapping. Every tier MUST appear here;
# valid points are per_iteration, pre_audit, and pre_merge.
when:
  fast:
    - per_iteration
  slow:
    - pre_audit
    - pre_merge
